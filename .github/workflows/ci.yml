name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@20cfd1bf5a88efc99e6f00d84b7524177933953f # v10.0.1
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv run --locked pytest
      - run: uv build --no-build-isolation
      - name: Export locked package-test dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file /tmp/shim-runtime.lock
          uv export --locked --only-dev --no-emit-project --output-file /tmp/shim-dev.lock
      - name: Check wheel contents
        run: |
          python -c 'from pathlib import Path; from zipfile import ZipFile; wheel = next(Path("dist").glob("*.whl")); names = ZipFile(wheel).namelist(); assert "shim_guard/__init__.py" in names; assert any(name.endswith(".dist-info/METADATA") for name in names)'
      - name: Verify packaged wheel contracts and benchmark
        run: |
          uv venv --python 3.13 /tmp/shim-guard-wheel
          uv pip install --python /tmp/shim-guard-wheel --require-hashes -r /tmp/shim-runtime.lock -r /tmp/shim-dev.lock
          uv pip install --python /tmp/shim-guard-wheel --no-deps dist/*.whl
          /tmp/shim-guard-wheel/bin/shim --help
          test -x /tmp/shim-guard-wheel/bin/shim-guard-hook
          test -z "$(printf '%s' '{"hook_event_name":"UserPromptSubmit","prompt":"Synthetic safe prompt"}' | /tmp/shim-guard-wheel/bin/shim-guard-hook codex 2>&1)"
          /tmp/shim-guard-wheel/bin/shim demo codex --json
          /tmp/shim-guard-wheel/bin/python -I -B -m pytest tests/contracts/codex/test_hook.py
          /tmp/shim-guard-wheel/bin/python -I -B -m pytest tests/contracts/claude/test_claude_hook.py
          python scripts/benchmark_hook.py --self-check
          python scripts/benchmark_hook.py /tmp/shim-guard-wheel/bin/python --samples-per-fixture 1 --output /tmp/shim-benchmark.json
      - name: Verify packaged source distribution contracts
        run: |
          uv venv --python 3.13 /tmp/shim-guard-sdist
          uv pip install --python /tmp/shim-guard-sdist --require-hashes -r /tmp/shim-runtime.lock -r /tmp/shim-dev.lock
          uv pip install --python /tmp/shim-guard-sdist --no-deps --no-build-isolation dist/*.tar.gz
          test -x /tmp/shim-guard-sdist/bin/shim-guard-hook
          test -z "$(printf '%s' '{"hook_event_name":"UserPromptSubmit","prompt":"Synthetic safe prompt"}' | /tmp/shim-guard-sdist/bin/shim-guard-hook codex 2>&1)"
          /tmp/shim-guard-sdist/bin/shim demo codex --json
          /tmp/shim-guard-sdist/bin/python -I -B -m pytest tests/contracts/codex/test_hook.py
          /tmp/shim-guard-sdist/bin/python -I -B -m pytest tests/contracts/claude/test_claude_hook.py
