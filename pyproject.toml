[project]
name = "shim-guard"
version = "0.1.3"
description = "Local pre-submit privacy protection for coding-agent CLIs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SHIM Engineering" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "presidio-analyzer==2.2.364",
  "rich==15.0.0",
  "tldextract==5.3.2",
  "tomli-w==1.2.0",
  "typer==0.27.1",
]

[project.urls]
Homepage = "https://github.com/GetSHIM/shim-guard"
Repository = "https://github.com/GetSHIM/shim-guard"
Issues = "https://github.com/GetSHIM/shim-guard/issues"
Documentation = "https://github.com/GetSHIM/shim-guard#readme"

[project.scripts]
shim = "shim_guard.cli.app:main"
shim-guard-hook = "shim_guard.hook:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.15.22,<0.16",
  "ty>=0.0.65,<0.1",
  "uv-build==0.12.5",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.5"

[tool.uv.build-backend]
module-name = "shim_guard"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ty.src]
include = ["src"]
